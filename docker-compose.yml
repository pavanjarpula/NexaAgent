version: "3.8"

services:
  # ==========================================
  # INFRASTRUCTURE
  # ==========================================
  weaviate:
    image: semitechnologies/weaviate:latest
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # EMPLOYEE MANAGEMENT SERVICES
  # ==========================================
  employee-mcp-server:
    build:
      context: ./employee-management
      dockerfile: Dockerfile
    ports:
      - "8005:8005"
    environment:
      - WEAVIATE_URL=http://weaviate:8080
      - NOMIC_API_URL=http://host.docker.internal:11434/api/embeddings
      - LLM_URL=http://host.docker.internal:11434/v1/chat/completions
    depends_on:
      weaviate:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  employee-mcp-client:
    build:
      context: ./employee-management/client
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - WEAVIATE_URL=http://weaviate:8080
      - NOMIC_API_URL=http://host.docker.internal:11434/api/embeddings
      - LLM_URL=http://host.docker.internal:11434/v1/chat/completions
      - MCP_SERVER_URL=http://employee-mcp-server:8005/sse
    depends_on:
      - employee-mcp-server
      - weaviate
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ==========================================
  # FOOD / CAFETERIA SERVICES
  # ==========================================
  food-app:
    build:
      context: ./cafeteria_meal_service/application
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - WEAVIATE_HOST=weaviate
      - WEAVIATE_PORT=8080
      - NOMIC_API_URL=http://host.docker.internal:11434/api/embeddings
    volumes:
      - ./cafeteria_meal_service/application:/app
    depends_on:
      weaviate:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  food-mcp-server:
    build:
      context: ./cafeteria_meal_service/mcp_server
      dockerfile: Dockerfile
    ports:
      - "8123:8123"
    environment:
      - WEAVIATE_HOST=weaviate
      - WEAVIATE_PORT=8080
      - APP_URL=http://food-app:8000
    depends_on:
      - food-app
      - weaviate
    extra_hosts:
      - "host.docker.internal:host-gateway"

  food-mcp-client:
    build:
      context: ./cafeteria_meal_service
      dockerfile: Dockerfile
    ports:
      - "7123:7123"
    environment:
      - WEAVIATE_HOST=weaviate
      - WEAVIATE_PORT=8080
      - MCP_SERVER_URL=http://food-mcp-server:8123/sse
      - LLM_URL=http://host.docker.internal:11434/v1/chat/completions
    depends_on:
      - food-mcp-server
      - food-app
      - weaviate
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ==========================================
  # FRONTEND
  # ==========================================
  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - BACKEND_BASE_URL=http://frontend-proxy:5000
      - FOOD_API_URL=http://food-mcp-client:7123/
      - LLM_URL=http://host.docker.internal:11434/v1/chat/completions
    depends_on:
      - employee-mcp-client
      - food-mcp-client

  # ==========================================
  # NGINX PROXY (routes frontend to backends)
  # ==========================================
  frontend-proxy:
    image: nginx:alpine
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - employee-mcp-client

volumes:
  weaviate_data:
